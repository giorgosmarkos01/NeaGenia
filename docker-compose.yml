services:
  mysql:
    image: mysql:8.0
    container_name: svkeshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: svkeshop_dev_pw
      MYSQL_DATABASE: svk_website
    ports:
      - "3306:3306"
    volumes:
      - svkeshop-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psvkeshop_dev_pw"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  svkeshop-mysql-data:
